
name: Deploy Universal Cosmos Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Diagnostic step: prints selected OIDC claims,
      # never the full token.
      # Remove this step once authentication works.
      - name: Check GitHub OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"

          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={
                  "Authorization": "Bearer " + token
              }
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("=== GitHub OIDC Identity ===")

          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
              "event_name"
          ):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::831926610457:role/UniversalCosmosGitHubDeployRole
          aws-region: ap-south-1
          role-session-name: UniversalCosmosDeploy
          retry-max-attempts: 3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PARAMS=$(python3 - <<'PY'
          import json
          import os

          sha = os.environ["DEPLOY_SHA"]

          commands = [
              "set -eu",
              "cd /home/ubuntu/universal-cosmos-backend",
              "sudo -u ubuntu git fetch origin main",
              f"sudo -u ubuntu git checkout --detach {sha}",
              "sudo -u ubuntu npm ci",
              "sudo -u ubuntu npm run db:generate",
              "sudo -u ubuntu npm run build",
              "sudo -u ubuntu npm run db:deploy",
              "systemctl restart universal-cosmos",
              "systemctl is-active --quiet universal-cosmos",
              "sleep 3",
              "curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused http://localhost:4000/api/v1/objects > /dev/null"
          ]

          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ead6a3c2fe0fdc5f \
            --document-name AWS-RunShellScript \
            --comment "Universal Cosmos backend deployment" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ead6a3c2fe0fdc5f; then

            echo "Deployment failed. SSM output:"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0ead6a3c2fe0fdc5f \
              --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}'

            exit 1
          fi

          echo "Deployment completed successfully."

      - name: Deployment summary
        if: success()
        run: |
          echo "## Universal Cosmos Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: ap-south-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: i-0ead6a3c2fe0fdc5f" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
