
name: Deploy Universal Cosmos Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::831926610457:role/UniversalCosmosGitHubDeployRole
          aws-region: ap-south-1

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ead6a3c2fe0fdc5f \
            --document-name AWS-RunShellScript \
            --comment "Universal Cosmos backend deployment" \
            --parameters '{"commands":["set -eu","cd /home/ubuntu/universal-cosmos-backend","sudo -u ubuntu git pull --ff-only origin main","sudo -u ubuntu npm ci","sudo -u ubuntu npm run db:generate","sudo -u ubuntu npm run build","sudo -u ubuntu npm run db:deploy","systemctl restart universal-cosmos","systemctl is-active --quiet universal-cosmos","curl --fail --silent --show-error http://localhost:4000/api/v1/objects > /dev/null"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ead6a3c2fe0fdc5f || {
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0ead6a3c2fe0fdc5f \
                --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}'
              exit 1
            }

          echo "Deployment completed successfully."
