name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cosmos
          POSTGRES_PASSWORD: ci_only_disposable
          POSTGRES_DB: cosmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmos -d cosmos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://cosmos:ci_only_disposable@127.0.0.1:5432/cosmos_test?schema=public
